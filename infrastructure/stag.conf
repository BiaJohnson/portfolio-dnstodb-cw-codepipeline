# Same bucket as pipeline/ (app_state_bucket_name). Terraform in pipeline/
# creates the bucket and this lock table when manage_app_remote_state is true.
bucket         = "dnstodb-cw-codepipeline-tfstate"
key            = "dnstodb-cw/stag/terraform.tfstate"
region         = "us-east-1"
dynamodb_table = "dnstodb-cw-stag-tfstate"
